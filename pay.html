<!DOCTYPE html>
<head>
    <title>Book Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css\style.css">
    <script defer src="JavaScript/JavaScript.js"></script>

</head>

<body>
    <div id="Top">
        <img src="images/Book_Logo.png" alt="Logo_image" id="logo">
        <div id="title">
            <h1>My Bookshop</h1>
            <p>Buy your favorite books here!</p>
        </div>
    </div>   
    
    <div class="NavClass">
        <a href="index.html" class="active">     Home        </a>
        <a href="#">                    Contact Us  </a>
        <a href="#">                    About Us    </a>
    </div>
    
    <div class="container">
        <h2>Enter Card Details</h2>
        <form>
            <div class="Input">
                <label >Card Number</label>
                <input type="number" id="card_number"required>
            </div>
            <div class="Input">
                <label>CVV</label>
                <input type="number" id="cvv"required>
            </div>
            <div class="Input">
                <label>Expiry Month</label>
                <select id="expiry_month"required>
                <option value="">Select Month</option>
                <option value="01">January</option>
                <option value="02">February</option>
                <option value="03">March</option>
                <option value="04">April</option>
                <option value="05">May</option>
                <option value="06">June</option>
                <option value="07">July</option>
                <option value="08">August</option>
                <option value="09">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
                </select>
            </div>
            <div class="Input">
                <label>Expiry Year</label>
                <select id="expiry_year"required>
                <option value="">Select Year</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
                </select>
            </div>
            <button type="submit" id="btn_Pay">Continue</button>
        </form>
    </div>        
</body>

</html>
